<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>EdenStardust</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400&family=Inter:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  /* Layout: one full-bleed canvas of drifting dust with astronaut monkeys hopping between bright stars; quiet caption bottom-left. Single deliberate dark look. */
  :root {
    --void: #05060d;
    --dust-warm: #f3d9a4;
    --dust-cool: #9fb8ff;
    --text: #e9e6f2;
    --muted: #8a87a3;
    --display: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
    --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { background: var(--void); color: var(--text); font-family: var(--body); overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .caption {
    position: fixed; left: 0; bottom: 0;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 0 calc(28px + env(safe-area-inset-bottom, 0px));
    display: grid; gap: 6px; pointer-events: none;
  }
  h1 { margin: 0; font: italic 400 clamp(2.6rem, 8vw, 5.5rem)/0.95 var(--display); letter-spacing: 0.01em; text-wrap: balance; }
  p { margin: 0; font-size: 0.78rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }

  [hidden] { display: none !important; }

  /* Login gate */
  .gate {
    position: fixed; inset: 0; display: grid; place-items: center;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 24px;
    background: rgba(5, 6, 13, 0.35);
  }
  .card {
    width: min(360px, 100%); display: grid; gap: 14px; padding: 28px 24px 22px;
    background: rgba(12, 13, 28, 0.78); border: 1px solid rgba(223, 230, 255, 0.14); border-radius: 16px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
  }
  .brand { margin: 0; font: italic 400 2.4rem/1 var(--display); text-align: center; }
  .tagline { text-align: center; text-transform: none; letter-spacing: 0.02em; font-size: 0.85rem; }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; border-radius: 10px; background: rgba(223, 230, 255, 0.06); }
  .tabs button { font: 500 0.85rem var(--body); color: var(--muted); background: transparent; border: 0; border-radius: 7px; padding: 8px; cursor: pointer; }
  .tabs button[aria-selected="true"] { background: rgba(243, 217, 164, 0.16); color: var(--text); }
  .field { display: grid; gap: 6px; }
  .field label { font-size: 0.78rem; color: var(--muted); }
  .field input {
    font: 400 0.95rem var(--body); color: var(--text); background: rgba(5, 6, 13, 0.6);
    border: 1px solid rgba(223, 230, 255, 0.18); border-radius: 9px; padding: 11px 12px;
  }
  .field input:focus { outline: 2px solid var(--dust-warm); outline-offset: 1px; border-color: transparent; }
  .primary {
    font: 500 0.95rem var(--body); color: #1a1408; background: var(--dust-warm);
    border: 0; border-radius: 9px; padding: 12px; cursor: pointer;
  }
  .primary:disabled { opacity: 0.6; cursor: wait; }
  .primary:focus-visible, .tabs button:focus-visible, .linkbtn:focus-visible, .bar button:focus-visible { outline: 2px solid var(--dust-cool); outline-offset: 2px; }
  .msg { min-height: 1.2em; text-transform: none; letter-spacing: 0; font-size: 0.85rem; text-align: center; }
  .msg.error { color: #ff9c8f; }
  .msg.ok { color: #a8e6b8; }
  .google {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    font: 500 0.95rem var(--body); color: #1f1f1f; background: #ffffff;
    border: 1px solid #dadce0; border-radius: 9px; padding: 11px; cursor: pointer;
  }
  .google:focus-visible { outline: 2px solid var(--dust-cool); outline-offset: 2px; }
  .or { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; font-size: 0.75rem; color: var(--muted); }
  .or::before, .or::after { content: ""; height: 1px; background: rgba(223, 230, 255, 0.14); }
  .legal { text-align: center; text-transform: none; letter-spacing: 0; font-size: 0.75rem; }
  .legal a { color: var(--muted); }
  .linkbtn { font: 400 0.8rem var(--body); color: var(--dust-cool); background: none; border: 0; cursor: pointer; text-decoration: underline; justify-self: center; }
  .bar {
    position: fixed; top: calc(14px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; align-items: center; gap: 10px; font-size: 0.8rem; color: var(--muted);
  }
  .entries {
    position: fixed; top: calc(58px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
    width: min(560px, calc(100vw - 32px)); max-height: min(70vh, 620px); display: flex; flex-direction: column; gap: 10px;
    padding: 18px 18px 14px; background: rgba(12, 13, 28, 0.88); border: 1px solid rgba(223, 230, 255, 0.14); border-radius: 14px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
  }
  .entries-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .entries-head h2 { margin: 0; font: italic 400 1.6rem/1 var(--display); }
  .entries-head button { font: 500 0.8rem var(--body); color: var(--muted); background: none; border: 0; cursor: pointer; }
  .head-actions { display: flex; align-items: center; gap: 6px; }
  .entries-head .icon-btn { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 8px; color: var(--muted); }
  .entries-head .icon-btn:hover, .entries-head .icon-btn[aria-expanded="true"] { color: var(--dust-warm); background: rgba(243, 217, 164, 0.1); }
  .entries-head button:focus-visible { outline: 2px solid var(--dust-cool); outline-offset: 2px; }
  .share { display: grid; gap: 8px; padding: 12px; border-radius: 10px; background: rgba(223, 230, 255, 0.05); border: 1px solid rgba(223, 230, 255, 0.1); }
  .share label { font-size: 0.78rem; color: var(--muted); }
  .share-row { display: flex; gap: 8px; }
  .share-row select { flex: 1 1 auto; min-width: 0; font: 400 0.85rem var(--body); color: var(--text); background: rgba(5, 6, 13, 0.6); border: 1px solid rgba(223, 230, 255, 0.18); border-radius: 8px; padding: 8px 10px; }
  .share-row button { font: 500 0.85rem var(--body); color: #1a1408; background: var(--dust-warm); border: 0; border-radius: 8px; padding: 8px 14px; cursor: pointer; }
  .share-row button:disabled { opacity: 0.5; cursor: default; }
  .share .msg { text-align: left; min-height: 0; margin: 0; }
  .share-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 0.82rem; }
  .share-list li { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 4px 0; border-top: 1px solid rgba(223, 230, 255, 0.06); word-break: break-word; }
  .share-list button { font: 500 0.75rem var(--body); color: #ff9c8f; background: none; border: 0; cursor: pointer; flex: none; }
  .share-title { font-size: 0.75rem; color: var(--muted); }
  .entries-sum { text-transform: none; letter-spacing: 0; font-size: 0.82rem; }
  .entries-scroll { flex: 1 1 auto; overflow: auto; min-height: 0; border-top: 1px solid rgba(223, 230, 255, 0.1); }
  .entries table { width: 100%; border-collapse: collapse; font-size: 0.82rem; font-variant-numeric: tabular-nums; }
  .entries th { position: sticky; top: 0; background: rgba(12, 13, 28, 0.98); text-align: left; font-weight: 500; color: var(--muted); padding: 8px 6px; }
  .entries td { padding: 7px 6px; border-top: 1px solid rgba(223, 230, 255, 0.06); vertical-align: top; word-break: break-word; }
  .entries td:first-child, .entries th:first-child { color: var(--muted); width: 2.2em; }
  .chip { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 0.72rem; background: rgba(159, 184, 255, 0.14); color: var(--dust-cool); }
  .chip.google { background: rgba(243, 217, 164, 0.16); color: var(--dust-warm); }
  .bar button { font: 500 0.8rem var(--body); color: var(--text); background: rgba(223, 230, 255, 0.08); border: 1px solid rgba(223, 230, 255, 0.18); border-radius: 999px; padding: 6px 14px; cursor: pointer; }

  /* Dashboard ("My seat plans"): the Seat Plan look — IBM Plex, butterfly-blue buttons, white tiles. */
  :root {
    --d-bg: #f5f7f9; --d-paper: #ffffff; --d-fg: #18202a; --d-muted: #5d6874; --d-line: #d5dce3;
    --d-btn: #144878; --d-btn-hover: #0e3659; --d-btn-ink: #ffffff; --d-soft: #dbeaf7; --d-red: #b42318;
    --d-display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
    --d-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --d-bg: #11161b; --d-paper: #171d23; --d-fg: #e3e8ed; --d-muted: #97a2ae; --d-line: #2b343d; --d-soft: #1f3448; --d-red: #ff8a7a; }
  }
  :root[data-theme="dark"] { --d-bg: #11161b; --d-paper: #171d23; --d-fg: #e3e8ed; --d-muted: #97a2ae; --d-line: #2b343d; --d-soft: #1f3448; --d-red: #ff8a7a; }
  body.inside canvas, body.inside .caption { display: none; }
  .dash {
    position: fixed; inset: 0; z-index: 10; overflow-y: auto; background: var(--d-bg); color: var(--d-fg); font-family: var(--d-display);
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: calc(24px + env(safe-area-inset-top, 0px)) calc(48px + env(safe-area-inset-bottom, 0px));
  }
  .dash-in { max-width: 1280px; margin: 0 auto; display: grid; gap: 24px; }
  .dash-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; border-bottom: 2px solid var(--d-fg); padding-bottom: 14px; }
  .dash-brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .dash-brand svg { width: 44px; height: 44px; flex: none; }
  .dash-brand h1 { margin: 0; font: 600 clamp(1.5rem, 4vw, 2rem)/1.1 var(--d-display); text-wrap: balance; }
  .dash .bar { position: static; color: var(--d-muted); font-family: var(--d-mono); flex-wrap: wrap; }
  .dash .bar button { font: 600 0.85rem var(--d-mono); color: var(--d-btn-ink); background: var(--d-btn); border: 0; border-radius: 8px; padding: 8px 14px; }
  .dash .bar button:hover { background: var(--d-btn-hover); }
  .dash-note { margin: 0; color: var(--d-muted); font-size: 0.95rem; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(240px, 100%), 1fr)); gap: 16px; }
  .tile { position: relative; display: grid; grid-template-rows: auto 1fr; background: var(--d-paper); border: 1px solid var(--d-line); border-radius: 8px; overflow: hidden; min-width: 0; }
  .tile:hover { border-color: var(--d-btn); box-shadow: 0 6px 20px rgba(20, 72, 120, 0.12); }
  .tile .open { display: contents; color: inherit; text-decoration: none; }
  .tile .thumb { aspect-ratio: 4 / 3; max-width: 100%; background: #ffffff; display: grid; place-items: center; border-bottom: 1px solid var(--d-line); overflow: hidden; }
  .tile .thumb img { width: 100%; height: 100%; object-fit: contain; }
  .tile .thumb .none { font: 500 0.9rem var(--d-display); color: #8a95a1; }
  .tile .info { display: grid; gap: 2px; padding: 10px 12px 12px; padding-right: 92px; min-width: 0; }
  .tile .info b { font: 600 1.05rem/1.25 var(--d-display); overflow-wrap: anywhere; }
  .tile .info span { font: 400 0.8rem var(--d-mono); color: var(--d-muted); font-variant-numeric: tabular-nums; }
  .tile .del { position: absolute; right: 10px; bottom: 12px; font: 500 0.78rem var(--d-mono); color: var(--d-btn); background: var(--d-paper); border: 1px solid var(--d-line); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  .tile .del:hover { color: var(--d-red); border-color: var(--d-red); }
  .tile .del.sure { color: #ffffff; background: var(--d-red); border-color: var(--d-red); }
  .tile .open:focus-visible .thumb { outline: 3px solid var(--d-btn); outline-offset: -3px; }
  .tile .del:focus-visible, .newtile:focus-visible, .dash .bar button:focus-visible { outline: 2px solid var(--d-btn); outline-offset: 2px; }
  .newtile { display: grid; place-items: center; align-content: center; gap: 6px; min-height: 220px; background: transparent; border: 2px dashed var(--d-line); border-radius: 8px; color: var(--d-btn); font: 600 1.1rem var(--d-display); cursor: pointer; }
  .newtile:hover { border-color: var(--d-btn); background: var(--d-soft); }
  .newtile .plus { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 12px; background: var(--d-btn); color: #ffffff; font: 500 1.6rem/1 var(--d-mono); }
  .newtile:disabled { opacity: 0.6; cursor: wait; }
  .sample-tag { font: 600 0.7rem var(--d-mono); color: var(--d-muted); text-transform: uppercase; letter-spacing: 0.06em; }
  .entries { z-index: 30; }
  @media (max-width: 600px) { .entries { left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); width: auto; } }
  body.inside .entries { background: var(--d-paper); color: var(--d-fg); border-color: var(--d-line); box-shadow: 0 12px 40px rgba(24, 32, 42, 0.18); backdrop-filter: none; -webkit-backdrop-filter: none; font-family: var(--d-display); }
  body.inside .entries-head h2 { font: 600 1.4rem/1 var(--d-display); }
  body.inside .entries th { background: var(--d-paper); color: var(--d-muted); }
  body.inside .entries td { border-top-color: var(--d-line); }
  body.inside .entries td:first-child, body.inside .entries-sum, body.inside .share label, body.inside .share-title, body.inside .entries-head button { color: var(--d-muted); }
  body.inside .entries-scroll { border-top-color: var(--d-line); }
  body.inside .share { background: var(--d-bg); border-color: var(--d-line); }
  body.inside .share-row select { background: var(--d-paper); color: var(--d-fg); border-color: var(--d-line); }
  body.inside .share-row button { background: var(--d-btn); color: #ffffff; }
  body.inside .entries-head .icon-btn:hover, body.inside .entries-head .icon-btn[aria-expanded="true"] { color: var(--d-btn); background: var(--d-soft); }
  body.inside .share .msg.ok { color: #1d7a3e; }
  body.inside .share .msg.error, body.inside .share-list button { color: var(--d-red); }
</style>

<canvas id="sky" aria-label="Animated field of stardust with monkeys in astronaut suits jumping between bright stars"></canvas>
<div class="caption" id="caption" hidden>
  <h1>Stardust</h1>
  <p>Interstellar grains · 0.1–1 µm</p>
</div>

<div class="bar" id="bar" hidden>
  <span id="who"></span>
  <button type="button" id="entries-btn" hidden>Entries</button>
  <button type="button" id="signout">Sign out</button>
</div>

<section class="entries" id="entries" hidden aria-label="Login entries">
  <div class="entries-head">
    <h2>Entries</h2>
    <div class="head-actions">
      <button type="button" class="icon-btn" id="share-btn" hidden aria-label="Share entries" title="Share entries" aria-expanded="false" aria-controls="share">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>
      </button>
      <button type="button" id="entries-close">Close</button>
    </div>
  </div>
  <div class="share" id="share" hidden>
    <label for="share-select">Share entries with a signed-up person</label>
    <div class="share-row">
      <select id="share-select"></select>
      <button type="button" id="share-add">Share</button>
    </div>
    <p class="msg" id="share-msg" role="status"></p>
    <div class="share-title" id="share-title">Shared with</div>
    <ul class="share-list" id="share-list"></ul>
  </div>
  <p class="entries-sum" id="entries-sum">Loading…</p>
  <div class="entries-scroll">
    <table>
      <thead><tr><th>#</th><th>Email</th><th>First entry</th><th>Last entry</th></tr></thead>
      <tbody id="entries-rows"></tbody>
    </table>
  </div>
</section>

<div class="dash" id="dash" hidden>
  <div class="dash-in">
    <header class="dash-head" id="dash-head">
      <div class="dash-brand">
        <svg viewBox="0 0 48 48" aria-hidden="true"><rect x="1" y="1" width="46" height="46" rx="13" fill="#144878"/><g fill="#ffffff"><path d="M23.5 21.5 C21 12.8 15.2 8.4 7 7 C6.6 15.4 7.8 22.2 11.6 25.4 C14.9 28 19 28.2 23.5 27.5 Z"/><path d="M23.5 28.5 C16.4 28.4 11.6 31.4 10.5 41 C17.8 41.6 22.8 37.2 23.5 31.6 Z"/><g transform="translate(48 0) scale(-1 1)"><path d="M23.5 21.5 C21 12.8 15.2 8.4 7 7 C6.6 15.4 7.8 22.2 11.6 25.4 C14.9 28 19 28.2 23.5 27.5 Z"/><path d="M23.5 28.5 C16.4 28.4 11.6 31.4 10.5 41 C17.8 41.6 22.8 37.2 23.5 31.6 Z"/></g></g></svg>
        <h1>My seat plans</h1>
      </div>
    </header>
    <p class="dash-note" id="dash-note" role="status"></p>
    <div class="tiles" id="tiles">
      <button type="button" class="newtile" id="newplan"><span class="plus" aria-hidden="true">+</span>New plan</button>
    </div>
  </div>
</div>

<div class="gate" id="gate">
  <form class="card" id="auth-form" novalidate>
    <h2 class="brand">EdenStardust</h2>
    <p class="tagline">Log in to enter</p>
    <button type="button" class="google" id="google">
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      Continue with Google
    </button>
    <div class="or">or</div>
    <div class="tabs" role="tablist">
      <button type="button" role="tab" id="tab-login" aria-selected="true">Log in</button>
      <button type="button" role="tab" id="tab-signup" aria-selected="false">Sign up</button>
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" required>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" minlength="6" required>
    </div>
    <button type="submit" class="primary" id="submit">Log in</button>
    <p class="msg" id="msg" role="status"></p>
    <button type="button" class="linkbtn" id="preview" hidden>Preview the inside</button>
    <p class="legal"><a href="https://edenstardust.com/privacy.html">Privacy Policy</a> · <a href="https://edenstardust.com/terms.html">Terms of Service</a></p>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.min.js"></script>

<script>
(() => {
  const c = document.getElementById('sky');
  const ctx = c.getContext('2d');
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const TAU = Math.PI * 2;
  let w, h, dpr, grains = [], stars = [], anchors = [], monkeys = [], size = 48;

  const rand = (a, b) => a + Math.random() * (b - a);
  const ease = p => p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;

  function build() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    w = innerWidth; h = innerHeight;
    c.width = w * dpr; c.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    size = Math.max(36, Math.min(Math.min(w, h) / 9, 72));

    const n = Math.round(Math.min(w * h / 450, 4000));
    const R = Math.max(w, h) * 0.55;
    grains = Array.from({ length: n }, () => {
      const arm = Math.floor(Math.random() * 3);
      const r = Math.pow(Math.random(), 0.7) * R;
      const a = arm * (TAU / 3) + r / R * 4.2 + rand(-0.35, 0.35);
      return { r, a, s: rand(0.3, 1.6) * (1 - r / R * 0.5), speed: rand(0.00008, 0.0003) * (1.4 - r / R), warm: Math.random() < 0.55, tw: rand(0, TAU) };
    });
    stars = Array.from({ length: Math.round(w * h / 5000) }, () => ({ x: rand(0, w), y: rand(0, h), s: rand(0.3, 1.1), tw: rand(0, TAU) }));

    // Bright stars the monkeys land on, spread over a loose grid so they don't clump.
    const cols = w < 600 ? 2 : 4, rows = 2;
    anchors = [];
    for (let i = 0; i < cols; i++) for (let j = 0; j < rows; j++) {
      anchors.push({
        x: (i + rand(0.25, 0.75)) / cols * w,
        y: h * 0.18 + (j + rand(0.3, 0.7)) / rows * h * 0.52,
        tw: rand(0, TAU)
      });
    }
    const count = w < 600 ? 2 : 4;
    monkeys = Array.from({ length: count }, (_, i) => ({
      at: i * Math.floor(anchors.length / count), to: -1, start: 0, dur: 0,
      restUntil: performance.now() + rand(300, 1600), spin: 1, flips: 0, face: Math.random() < 0.5 ? 1 : -1, id: i
    }));
  }

  const restPos = a => ({ x: anchors[a].x, y: anchors[a].y - size * 0.5 });

  function step(m, t) {
    if (m.to >= 0) {
      const p = (t - m.start) / m.dur;
      if (p >= 1) { m.at = m.to; m.to = -1; m.restUntil = t + rand(600, 1600); }
    } else if (t >= m.restUntil) {
      const taken = new Set(monkeys.flatMap(o => [o.at, o.to]));
      const free = anchors.map((_, i) => i).filter(i => !taken.has(i));
      if (!free.length) { m.restUntil = t + 400; return; }
      m.to = free[Math.floor(Math.random() * free.length)];
      m.start = t; m.dur = rand(1300, 2100);
      m.flips = Math.random() < 0.6 ? 1 : 0;
      m.face = anchors[m.to].x >= anchors[m.at].x ? 1 : -1;
      m.spin = m.face;
    }
  }

  function placement(m, t) {
    if (m.to < 0) {
      const r = restPos(m.at);
      return { x: r.x, y: r.y + Math.sin(t * 0.004 + m.id) * 1.5, rot: Math.sin(t * 0.003 + m.id) * 0.08, tuck: 0, wave: Math.sin(t * 0.008 + m.id) };
    }
    const p = Math.min((t - m.start) / m.dur, 1);
    const A = restPos(m.at), B = restPos(m.to);
    const e = ease(p);
    const dist = Math.hypot(B.x - A.x, B.y - A.y);
    return {
      x: A.x + (B.x - A.x) * e,
      y: A.y + (B.y - A.y) * e - Math.sin(Math.PI * p) * (dist * 0.35 + size),
      rot: m.spin * m.flips * TAU * e,
      tuck: Math.sin(Math.PI * p),
      wave: 1
    };
  }

  // Monkey in a space suit, drawn in a ~60-unit box centred on the body.
  function drawMonkey(x, y, face, rot, tuck, wave) {
    const k = size / 60;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.scale(k * face, k);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';

    // tail poking out of the suit
    ctx.strokeStyle = '#6b4226'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-9, 14); ctx.quadraticCurveTo(-24, 20, -22, 6); ctx.quadraticCurveTo(-21, 0, -16, 2); ctx.stroke();

    // backpack
    ctx.fillStyle = '#b9bdcb';
    roundRect(-16, -5, 10, 20, 3); ctx.fill();

    // legs (tucked mid-jump)
    const legA = 0.25 + tuck * 0.9;
    ctx.strokeStyle = '#eef0f6'; ctx.lineWidth = 7;
    for (const sgn of [-1, 1]) {
      const hx = sgn * 5, hy = 18;
      const fx = hx + Math.sin(sgn * legA) * 11, fy = hy + Math.cos(legA) * 11;
      ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(fx, fy); ctx.stroke();
      ctx.fillStyle = '#7d8396'; ctx.beginPath(); ctx.ellipse(fx + sgn * 1.5, fy + 1.5, 4.5, 3, 0, 0, TAU); ctx.fill();
    }

    // suit body
    ctx.fillStyle = '#f4f5fa'; ctx.strokeStyle = '#9aa0b4'; ctx.lineWidth = 1.5;
    roundRect(-11, -4, 22, 25, 8); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#c7cbd8'; roundRect(-5, 3, 10, 8, 2); ctx.fill();
    ctx.fillStyle = '#e8574d'; ctx.beginPath(); ctx.arc(-2, 7, 1.4, 0, TAU); ctx.fill();
    ctx.fillStyle = '#4f8cff'; ctx.beginPath(); ctx.arc(2, 7, 1.4, 0, TAU); ctx.fill();

    // arms: one waves while resting, both up mid-jump
    ctx.strokeStyle = '#eef0f6'; ctx.lineWidth = 6;
    for (const sgn of [-1, 1]) {
      const lift = sgn === 1 ? wave : Math.max(wave, 0) * 0.4 + tuck * 0.6;
      const sx = sgn * 10, sy = 1;
      const hx = sx + sgn * 8, hy = sy + 8 - lift * 16;
      ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(hx, hy); ctx.stroke();
      ctx.fillStyle = '#7d8396'; ctx.beginPath(); ctx.arc(hx, hy, 3.2, 0, TAU); ctx.fill();
    }

    // neck ring
    ctx.fillStyle = '#9aa0b4'; roundRect(-8, -6, 16, 4, 2); ctx.fill();

    // monkey head inside the helmet
    ctx.fillStyle = '#7a4a2a';
    ctx.beginPath(); ctx.arc(-9.5, -17, 4, 0, TAU); ctx.arc(9.5, -17, 4, 0, TAU); ctx.fill();
    ctx.fillStyle = '#e8c39e';
    ctx.beginPath(); ctx.arc(-9.5, -17, 2, 0, TAU); ctx.arc(9.5, -17, 2, 0, TAU); ctx.fill();
    ctx.fillStyle = '#7a4a2a'; ctx.beginPath(); ctx.arc(0, -17, 8.5, 0, TAU); ctx.fill();
    ctx.fillStyle = '#e8c39e';
    ctx.beginPath(); ctx.arc(-3.2, -19, 3.6, 0, TAU); ctx.arc(3.2, -19, 3.6, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0, -13.5, 5.6, 4.2, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#1a1210';
    ctx.beginPath(); ctx.arc(-3.2, -19, 1.4, 0, TAU); ctx.arc(3.2, -19, 1.4, 0, TAU); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(-2.7, -19.5, 0.5, 0, TAU); ctx.arc(3.7, -19.5, 0.5, 0, TAU); ctx.fill();
    ctx.fillStyle = '#5a3520';
    ctx.beginPath(); ctx.arc(-1.2, -14.5, 0.6, 0, TAU); ctx.arc(1.2, -14.5, 0.6, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#5a3520'; ctx.lineWidth = 0.9;
    ctx.beginPath(); ctx.arc(0, -13, 2.6, 0.2 * Math.PI, 0.8 * Math.PI); ctx.stroke();

    // glass helmet
    ctx.fillStyle = 'rgba(170,200,255,0.16)'; ctx.strokeStyle = '#dfe6ff'; ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.arc(0, -17, 14, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(0, -17, 10.5, 1.1 * Math.PI, 1.4 * Math.PI); ctx.stroke();
    ctx.restore();
  }

  function roundRect(x, y, rw, rh, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + rw, y, x + rw, y + rh, r); ctx.arcTo(x + rw, y + rh, x, y + rh, r);
    ctx.arcTo(x, y + rh, x, y, r); ctx.arcTo(x, y, x + rw, y, r); ctx.closePath();
  }

  function drawAnchor(a, t) {
    const pulse = 0.8 + 0.2 * Math.sin(t * 0.002 + a.tw);
    const g = ctx.createRadialGradient(a.x, a.y, 0, a.x, a.y, 22 * pulse);
    g.addColorStop(0, 'rgba(255,240,210,0.9)');
    g.addColorStop(0.3, 'rgba(255,214,160,0.35)');
    g.addColorStop(1, 'rgba(255,214,160,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(a.x, a.y, 22 * pulse, 0, TAU); ctx.fill();
    ctx.fillStyle = '#fff6e4';
    const L = 11 * pulse, s = 1.6;
    ctx.beginPath();
    ctx.moveTo(a.x, a.y - L); ctx.lineTo(a.x + s, a.y - s); ctx.lineTo(a.x + L, a.y); ctx.lineTo(a.x + s, a.y + s);
    ctx.lineTo(a.x, a.y + L); ctx.lineTo(a.x - s, a.y + s); ctx.lineTo(a.x - L, a.y); ctx.lineTo(a.x - s, a.y - s);
    ctx.closePath(); ctx.fill();
  }

  function frame(t) {
    if (document.body.classList.contains('inside')) { if (!still) requestAnimationFrame(frame); return; }
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#05060d';
    ctx.fillRect(0, 0, w, h);
    const cx = w * 0.58, cy = h * 0.45;

    const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(w, h) * 0.45);
    glow.addColorStop(0, 'rgba(255,214,160,0.35)');
    glow.addColorStop(0.25, 'rgba(160,120,220,0.12)');
    glow.addColorStop(1, 'rgba(5,6,13,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, w, h);

    ctx.globalCompositeOperation = 'lighter';
    for (const s of stars) {
      ctx.globalAlpha = 0.4 + 0.4 * Math.sin(t * 0.001 + s.tw);
      ctx.fillStyle = '#dfe6ff';
      ctx.fillRect(s.x, s.y, s.s, s.s);
    }
    for (const g of grains) {
      if (!still) g.a += g.speed * 16;
      const x = cx + Math.cos(g.a) * g.r;
      const y = cy + Math.sin(g.a) * g.r * 0.55;
      ctx.globalAlpha = 0.35 + 0.35 * Math.sin(t * 0.002 + g.tw);
      ctx.fillStyle = g.warm ? '#f3d9a4' : '#9fb8ff';
      ctx.beginPath();
      ctx.arc(x, y, g.s, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    for (const a of anchors) drawAnchor(a, t);

    ctx.globalCompositeOperation = 'source-over';
    for (const m of monkeys) {
      if (!still) step(m, t);
      const p = placement(m, still ? 0 : t);
      drawMonkey(p.x, p.y, m.face, p.rot, p.tuck, still ? 0.6 : p.wave);
    }
    if (!still) requestAnimationFrame(frame);
  }

  addEventListener('resize', () => { build(); if (still) frame(0); });
  build();
  still ? frame(0) : requestAnimationFrame(frame);
})();

    list.forEach(p => {
      const tile = document.createElement('div');
      tile.className = 'tile';
      const a = document.createElement('a');
      a.className = 'open';
      a.href = sample ? '#' : 'plan.html?id=' + encodeURIComponent(p.id);
      a.setAttribute('aria-label', 'Open ' + (p.title || 'seat plan'));
      if (sample) a.addEventListener('click', e => { e.preventDefault(); dashSay('Sample tile. Real plans open on edenstardust.com.'); });
      const th = document.createElement('div'); th.className = 'thumb';
      const url = thumbs[p.thumb];
      if (url) { const img = document.createElement('img'); img.src = url; img.alt = ''; img.loading = 'lazy'; th.append(img); }
      else { const n = document.createElement('span'); n.className = 'none'; n.textContent = 'No layout yet'; th.append(n); }
      const info = document.createElement('div'); info.className = 'info';
      const b = document.createElement('b'); b.textContent = p.title || 'New floor';
      const s = document.createElement('span'); s.textContent = (p.seats || 0) + ' seats · ' + fmtDay(p.updated_at);
      info.append(b, s);
      if (sample) { const t = document.createElement('span'); t.className = 'sample-tag'; t.textContent = 'Sample'; info.append(t); }
      a.append(th, info);
      const del = document.createElement('button');
      del.type = 'button'; del.className = 'del'; del.textContent = 'Delete';
      del.setAttribute('aria-label', 'Delete ' + (p.title || 'seat plan'));
      del.addEventListener('click', () => {
        if (!del.classList.contains('sure')) {
          tiles.querySelectorAll('.del.sure').forEach(o => { o.classList.remove('sure'); o.textContent = 'Delete'; });
          del.classList.add('sure'); del.textContent = 'Are you sure?'; return;
        }
        deletePlan(p, sample);
      });
      tile.append(a, del);
      tiles.append(tile);
    });
    dashSay(list.length ? '' : 'No seat plans yet. Press New plan to start one.');
  }

  let samplePlans = null;
  async function loadPlans() {
    if (previewing || !onSite) {
      if (!samplePlans) {
        const now = Date.now();
        samplePlans = [
          { id: 's1', title: 'Example tower · floor 25', seats: 304, thumb: null, updated_at: new Date(now - 2 * 3600e3).toISOString() },
          { id: 's2', title: 'Example HQ · level 1', seats: 118, thumb: null, updated_at: new Date(now - 6 * 86400e3).toISOString() }
        ];
      }
      return renderPlans(samplePlans, {}, true);
    }
    dashSay('Loading your plans…');
    try {
      const { data, error } = await sb.from('plans').select('id, title, thumb, seats, updated_at').order('updated_at', { ascending: false });
      if (error) throw error;
      const paths = (data || []).map(p => p.thumb).filter(Boolean), thumbs = {};
      if (paths.length) {
        const r = await sb.storage.from('plan-files').createSignedUrls(paths, 3600);
        (r.data || []).forEach(x => { if (x.signedUrl) thumbs[x.path] = x.signedUrl; });
      }
      renderPlans(data || [], thumbs, false);
    } catch (err) {
      dashSay('Could not load your plans: ' + (err.message || 'unknown error') + '. Refresh to try again.');
    }
  }

  async function deletePlan(p, sample) {
    if (sample) { samplePlans = samplePlans.filter(x => x.id !== p.id); return loadPlans(); }
    try {
      const { data: files } = await sb.storage.from('plan-files').list(curUserId() + '/' + p.id, { limit: 1000 });
      if (files && files.length) await sb.storage.from('plan-files').remove(files.map(f => curUserId() + '/' + p.id + '/' + f.name));
      const { error } = await sb.from('plans').delete().eq('id', p.id);
      if (error) throw error;
      loadPlans();
    } catch (err) { dashSay('Could not delete the plan: ' + (err.message || 'unknown error')); }
  }

  function curUserId() { return currentUserId; }

  newPlanBtn.addEventListener('click', async () => {
    if (previewing || !onSite) {
      samplePlans.unshift({ id: 's' + Date.now(), title: 'New floor', seats: 0, thumb: null, updated_at: new Date().toISOString() });
      dashSay('Sample plan added. On edenstardust.com, New plan opens the Seat Plan editor.');
      return renderPlans(samplePlans, {}, true);
    }
    newPlanBtn.disabled = true; dashSay('Creating a new plan…');
    try {
      const { data, error } = await sb.from('plans').insert({ title: 'New floor' }).select('id').single();
      if (error) throw error;
      location.href = 'plan.html?id=' + encodeURIComponent(data.id);
    } catch (err) { newPlanBtn.disabled = false; dashSay('Could not create a plan: ' + (err.message || 'unknown error')); }
  });

  // the email, Entries and Sign out sit in the dashboard header
  $('dash-head').append(bar);
  addEventListener('pageshow', e => { if (e.persisted && plansLoadedFor) loadPlans(); });

  if (!onSite) {
    const p = $('preview');
    p.hidden = false;
    p.addEventListener('click', () => { previewing = true; show({ email: 'Preview' }); });
  }

  show(null);
  if (sb) {
    sb.auth.getSession().then(({ data }) => { if (data.session) show(data.session.user); }).catch(() => {});
    sb.auth.onAuthStateChange((event, session) => {
      if (previewing) return;
      show(session ? session.user : null);
      if (event === 'SIGNED_IN') setTimeout(() => logLogin(session), 0);
    });
  }
})();
</script>

</html>
