<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Stardust</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400&family=Inter:wght@400;500&display=swap">
<style>
  /* Layout: one full-bleed canvas of drifting dust with astronaut monkeys hopping between bright stars; quiet caption bottom-left. Single deliberate dark look. */
  :root {
    --void: #05060d;
    --dust-warm: #f3d9a4;
    --dust-cool: #9fb8ff;
    --text: #e9e6f2;
    --muted: #8a87a3;
    --display: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
    --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { background: var(--void); color: var(--text); font-family: var(--body); overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .caption {
    position: fixed; left: 0; bottom: 0;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 0 calc(28px + env(safe-area-inset-bottom, 0px));
    display: grid; gap: 6px; pointer-events: none;
  }
  h1 { margin: 0; font: italic 400 clamp(2.6rem, 8vw, 5.5rem)/0.95 var(--display); letter-spacing: 0.01em; text-wrap: balance; }
  p { margin: 0; font-size: 0.78rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }

  [hidden] { display: none !important; }

  /* Login gate */
  .gate {
    position: fixed; inset: 0; display: grid; place-items: center;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 24px;
    background: rgba(5, 6, 13, 0.35);
  }
  .card {
    width: min(360px, 100%); display: grid; gap: 14px; padding: 28px 24px 22px;
    background: rgba(12, 13, 28, 0.78); border: 1px solid rgba(223, 230, 255, 0.14); border-radius: 16px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
  }
  .brand { margin: 0; font: italic 400 2.4rem/1 var(--display); text-align: center; }
  .tagline { text-align: center; text-transform: none; letter-spacing: 0.02em; font-size: 0.85rem; }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; border-radius: 10px; background: rgba(223, 230, 255, 0.06); }
  .tabs button { font: 500 0.85rem var(--body); color: var(--muted); background: transparent; border: 0; border-radius: 7px; padding: 8px; cursor: pointer; }
  .tabs button[aria-selected="true"] { background: rgba(243, 217, 164, 0.16); color: var(--text); }
  .field { display: grid; gap: 6px; }
  .field label { font-size: 0.78rem; color: var(--muted); }
  .field input {
    font: 400 0.95rem var(--body); color: var(--text); background: rgba(5, 6, 13, 0.6);
    border: 1px solid rgba(223, 230, 255, 0.18); border-radius: 9px; padding: 11px 12px;
  }
  .field input:focus { outline: 2px solid var(--dust-warm); outline-offset: 1px; border-color: transparent; }
  .primary {
    font: 500 0.95rem var(--body); color: #1a1408; background: var(--dust-warm);
    border: 0; border-radius: 9px; padding: 12px; cursor: pointer;
  }
  .primary:disabled { opacity: 0.6; cursor: wait; }
  .primary:focus-visible, .tabs button:focus-visible, .linkbtn:focus-visible, .bar button:focus-visible { outline: 2px solid var(--dust-cool); outline-offset: 2px; }
  .msg { min-height: 1.2em; text-transform: none; letter-spacing: 0; font-size: 0.85rem; text-align: center; }
  .msg.error { color: #ff9c8f; }
  .msg.ok { color: #a8e6b8; }
  .google {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    font: 500 0.95rem var(--body); color: #1f1f1f; background: #ffffff;
    border: 1px solid #dadce0; border-radius: 9px; padding: 11px; cursor: pointer;
  }
  .google:focus-visible { outline: 2px solid var(--dust-cool); outline-offset: 2px; }
  .or { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; font-size: 0.75rem; color: var(--muted); }
  .or::before, .or::after { content: ""; height: 1px; background: rgba(223, 230, 255, 0.14); }
  .linkbtn { font: 400 0.8rem var(--body); color: var(--dust-cool); background: none; border: 0; cursor: pointer; text-decoration: underline; justify-self: center; }
  .bar {
    position: fixed; top: calc(14px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; align-items: center; gap: 10px; font-size: 0.8rem; color: var(--muted);
  }
  .bar button { font: 500 0.8rem var(--body); color: var(--text); background: rgba(223, 230, 255, 0.08); border: 1px solid rgba(223, 230, 255, 0.18); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
</style>

<canvas id="sky" aria-label="Animated field of stardust with monkeys in astronaut suits jumping between bright stars"></canvas>
<div class="caption" id="caption" hidden>
  <h1>Stardust</h1>
  <p>Interstellar grains · 0.1–1 µm</p>
</div>

<div class="bar" id="bar" hidden>
  <span id="who"></span>
  <button type="button" id="signout">Sign out</button>
</div>

<div class="gate" id="gate">
  <form class="card" id="auth-form" novalidate>
    <h2 class="brand">EdenStardust</h2>
    <p class="tagline">Log in to enter</p>
    <button type="button" class="google" id="google">
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      Continue with Google
    </button>
    <div class="or">or</div>
    <div class="tabs" role="tablist">
      <button type="button" role="tab" id="tab-login" aria-selected="true">Log in</button>
      <button type="button" role="tab" id="tab-signup" aria-selected="false">Sign up</button>
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" required>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" minlength="6" required>
    </div>
    <button type="submit" class="primary" id="submit">Log in</button>
    <p class="msg" id="msg" role="status"></p>
    <button type="button" class="linkbtn" id="preview" hidden>Preview the inside</button>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.min.js"></script>

<script>
(() => {
  const c = document.getElementById('sky');
  const ctx = c.getContext('2d');
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const TAU = Math.PI * 2;
  let w, h, dpr, grains = [], stars = [], anchors = [], monkeys = [], size = 48;

  const rand = (a, b) => a + Math.random() * (b - a);
  const ease = p => p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;

  function build() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    w = innerWidth; h = innerHeight;
    c.width = w * dpr; c.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    size = Math.max(36, Math.min(Math.min(w, h) / 9, 72));

    const n = Math.round(Math.min(w * h / 450, 4000));
    const R = Math.max(w, h) * 0.55;
    grains = Array.from({ length: n }, () => {
      const arm = Math.floor(Math.random() * 3);
      const r = Math.pow(Math.random(), 0.7) * R;
      const a = arm * (TAU / 3) + r / R * 4.2 + rand(-0.35, 0.35);
      return { r, a, s: rand(0.3, 1.6) * (1 - r / R * 0.5), speed: rand(0.00008, 0.0003) * (1.4 - r / R), warm: Math.random() < 0.55, tw: rand(0, TAU) };
    });
    stars = Array.from({ length: Math.round(w * h / 5000) }, () => ({ x: rand(0, w), y: rand(0, h), s: rand(0.3, 1.1), tw: rand(0, TAU) }));

    // Bright stars the monkeys land on, spread over a loose grid so they don't clump.
    const cols = w < 600 ? 2 : 4, rows = 2;
    anchors = [];
    for (let i = 0; i < cols; i++) for (let j = 0; j < rows; j++) {
      anchors.push({
        x: (i + rand(0.25, 0.75)) / cols * w,
        y: h * 0.18 + (j + rand(0.3, 0.7)) / rows * h * 0.52,
        tw: rand(0, TAU)
      });
    }
    const count = w < 600 ? 2 : 4;
    monkeys = Array.from({ length: count }, (_, i) => ({
      at: i * Math.floor(anchors.length / count), to: -1, start: 0, dur: 0,
      restUntil: performance.now() + rand(300, 1600), spin: 1, flips: 0, face: Math.random() < 0.5 ? 1 : -1, id: i
    }));
  }

  const restPos = a => ({ x: anchors[a].x, y: anchors[a].y - size * 0.5 });

  function step(m, t) {
    if (m.to >= 0) {
      const p = (t - m.start) / m.dur;
      if (p >= 1) { m.at = m.to; m.to = -1; m.restUntil = t + rand(600, 1600); }
    } else if (t >= m.restUntil) {
      const taken = new Set(monkeys.flatMap(o => [o.at, o.to]));
      const free = anchors.map((_, i) => i).filter(i => !taken.has(i));
      if (!free.length) { m.restUntil = t + 400; return; }
      m.to = free[Math.floor(Math.random() * free.length)];
      m.start = t; m.dur = rand(1300, 2100);
      m.flips = Math.random() < 0.6 ? 1 : 0;
      m.face = anchors[m.to].x >= anchors[m.at].x ? 1 : -1;
      m.spin = m.face;
    }
  }

  function placement(m, t) {
    if (m.to < 0) {
      const r = restPos(m.at);
      return { x: r.x, y: r.y + Math.sin(t * 0.004 + m.id) * 1.5, rot: Math.sin(t * 0.003 + m.id) * 0.08, tuck: 0, wave: Math.sin(t * 0.008 + m.id) };
    }
    const p = Math.min((t - m.start) / m.dur, 1);
    const A = restPos(m.at), B = restPos(m.to);
    const e = ease(p);
    const dist = Math.hypot(B.x - A.x, B.y - A.y);
    return {
      x: A.x + (B.x - A.x) * e,
      y: A.y + (B.y - A.y) * e - Math.sin(Math.PI * p) * (dist * 0.35 + size),
      rot: m.spin * m.flips * TAU * e,
      tuck: Math.sin(Math.PI * p),
      wave: 1
    };
  }

  // Monkey in a space suit, drawn in a ~60-unit box centred on the body.
  function drawMonkey(x, y, face, rot, tuck, wave) {
    const k = size / 60;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.scale(k * face, k);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';

    // tail poking out of the suit
    ctx.strokeStyle = '#6b4226'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-9, 14); ctx.quadraticCurveTo(-24, 20, -22, 6); ctx.quadraticCurveTo(-21, 0, -16, 2); ctx.stroke();

    // backpack
    ctx.fillStyle = '#b9bdcb';
    roundRect(-16, -5, 10, 20, 3); ctx.fill();

    // legs (tucked mid-jump)
    const legA = 0.25 + tuck * 0.9;
    ctx.strokeStyle = '#eef0f6'; ctx.lineWidth = 7;
    for (const sgn of [-1, 1]) {
      const hx = sgn * 5, hy = 18;
      const fx = hx + Math.sin(sgn * legA) * 11, fy = hy + Math.cos(legA) * 11;
      ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(fx, fy); ctx.stroke();
      ctx.fillStyle = '#7d8396'; ctx.beginPath(); ctx.ellipse(fx + sgn * 1.5, fy + 1.5, 4.5, 3, 0, 0, TAU); ctx.fill();
    }

    // suit body
    ctx.fillStyle = '#f4f5fa'; ctx.strokeStyle = '#9aa0b4'; ctx.lineWidth = 1.5;
    roundRect(-11, -4, 22, 25, 8); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#c7cbd8'; roundRect(-5, 3, 10, 8, 2); ctx.fill();
    ctx.fillStyle = '#e8574d'; ctx.beginPath(); ctx.arc(-2, 7, 1.4, 0, TAU); ctx.fill();
    ctx.fillStyle = '#4f8cff'; ctx.beginPath(); ctx.arc(2, 7, 1.4, 0, TAU); ctx.fill();

    // arms: one waves while resting, both up mid-jump
    ctx.strokeStyle = '#eef0f6'; ctx.lineWidth = 6;
    for (const sgn of [-1, 1]) {
      const lift = sgn === 1 ? wave : Math.max(wave, 0) * 0.4 + tuck * 0.6;
      const sx = sgn * 10, sy = 1;
      const hx = sx + sgn * 8, hy = sy + 8 - lift * 16;
      ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(hx, hy); ctx.stroke();
      ctx.fillStyle = '#7d8396'; ctx.beginPath(); ctx.arc(hx, hy, 3.2, 0, TAU); ctx.fill();
    }

    // neck ring
    ctx.fillStyle = '#9aa0b4'; roundRect(-8, -6, 16, 4, 2); ctx.fill();

    // monkey head inside the helmet
    ctx.fillStyle = '#7a4a2a';
    ctx.beginPath(); ctx.arc(-9.5, -17, 4, 0, TAU); ctx.arc(9.5, -17, 4, 0, TAU); ctx.fill();
    ctx.fillStyle = '#e8c39e';
    ctx.beginPath(); ctx.arc(-9.5, -17, 2, 0, TAU); ctx.arc(9.5, -17, 2, 0, TAU); ctx.fill();
    ctx.fillStyle = '#7a4a2a'; ctx.beginPath(); ctx.arc(0, -17, 8.5, 0, TAU); ctx.fill();
    ctx.fillStyle = '#e8c39e';
    ctx.beginPath(); ctx.arc(-3.2, -19, 3.6, 0, TAU); ctx.arc(3.2, -19, 3.6, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0, -13.5, 5.6, 4.2, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#1a1210';
    ctx.beginPath(); ctx.arc(-3.2, -19, 1.4, 0, TAU); ctx.arc(3.2, -19, 1.4, 0, TAU); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(-2.7, -19.5, 0.5, 0, TAU); ctx.arc(3.7, -19.5, 0.5, 0, TAU); ctx.fill();
    ctx.fillStyle = '#5a3520';
    ctx.beginPath(); ctx.arc(-1.2, -14.5, 0.6, 0, TAU); ctx.arc(1.2, -14.5, 0.6, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#5a3520'; ctx.lineWidth = 0.9;
    ctx.beginPath(); ctx.arc(0, -13, 2.6, 0.2 * Math.PI, 0.8 * Math.PI); ctx.stroke();

    // glass helmet
    ctx.fillStyle = 'rgba(170,200,255,0.16)'; ctx.strokeStyle = '#dfe6ff'; ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.arc(0, -17, 14, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(0, -17, 10.5, 1.1 * Math.PI, 1.4 * Math.PI); ctx.stroke();
    ctx.restore();
  }

  function roundRect(x, y, rw, rh, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + rw, y, x + rw, y + rh, r); ctx.arcTo(x + rw, y + rh, x, y + rh, r);
    ctx.arcTo(x, y + rh, x, y, r); ctx.arcTo(x, y, x + rw, y, r); ctx.closePath();
  }

  function drawAnchor(a, t) {
    const pulse = 0.8 + 0.2 * Math.sin(t * 0.002 + a.tw);
    const g = ctx.createRadialGradient(a.x, a.y, 0, a.x, a.y, 22 * pulse);
    g.addColorStop(0, 'rgba(255,240,210,0.9)');
    g.addColorStop(0.3, 'rgba(255,214,160,0.35)');
    g.addColorStop(1, 'rgba(255,214,160,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(a.x, a.y, 22 * pulse, 0, TAU); ctx.fill();
    ctx.fillStyle = '#fff6e4';
    const L = 11 * pulse, s = 1.6;
    ctx.beginPath();
    ctx.moveTo(a.x, a.y - L); ctx.lineTo(a.x + s, a.y - s); ctx.lineTo(a.x + L, a.y); ctx.lineTo(a.x + s, a.y + s);
    ctx.lineTo(a.x, a.y + L); ctx.lineTo(a.x - s, a.y + s); ctx.lineTo(a.x - L, a.y); ctx.lineTo(a.x - s, a.y - s);
    ctx.closePath(); ctx.fill();
  }

  function frame(t) {
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#05060d';
    ctx.fillRect(0, 0, w, h);
    const cx = w * 0.58, cy = h * 0.45;

    const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(w, h) * 0.45);
    glow.addColorStop(0, 'rgba(255,214,160,0.35)');
    glow.addColorStop(0.25, 'rgba(160,120,220,0.12)');
    glow.addColorStop(1, 'rgba(5,6,13,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, w, h);

    ctx.globalCompositeOperation = 'lighter';
    for (const s of stars) {
      ctx.globalAlpha = 0.4 + 0.4 * Math.sin(t * 0.001 + s.tw);
      ctx.fillStyle = '#dfe6ff';
      ctx.fillRect(s.x, s.y, s.s, s.s);
    }
    for (const g of grains) {
      if (!still) g.a += g.speed * 16;
      const x = cx + Math.cos(g.a) * g.r;
      const y = cy + Math.sin(g.a) * g.r * 0.55;
      ctx.globalAlpha = 0.35 + 0.35 * Math.sin(t * 0.002 + g.tw);
      ctx.fillStyle = g.warm ? '#f3d9a4' : '#9fb8ff';
      ctx.beginPath();
      ctx.arc(x, y, g.s, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    for (const a of anchors) drawAnchor(a, t);

    ctx.globalCompositeOperation = 'source-over';
    for (const m of monkeys) {
      if (!still) step(m, t);
      const p = placement(m, still ? 0 : t);
      drawMonkey(p.x, p.y, m.face, p.rot, p.tuck, still ? 0.6 : p.wave);
    }
    if (!still) requestAnimationFrame(frame);
  }

  addEventListener('resize', () => { build(); if (still) frame(0); });
  build();
  still ? frame(0) : requestAnimationFrame(frame);
})();

// Login gate (Supabase Auth). The publishable key is meant to be public.
(() => {
  const SUPABASE_URL = 'https://ldvzztgzamahlftnbawr.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_1BiE8kmut-C1AbXFck3QOA_11tONrHl';
  const onSite = /(^|\.)edenstardust\.com$/.test(location.hostname);
  const $ = id => document.getElementById(id);
  const gate = $('gate'), bar = $('bar'), caption = $('caption'), who = $('who');
  const form = $('auth-form'), email = $('email'), password = $('password');
  const submit = $('submit'), msg = $('msg'), tabLogin = $('tab-login'), tabSignup = $('tab-signup');
  let mode = 'login', previewing = false, sb = null;

  try { sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); } catch (e) { sb = null; }

  function say(text, kind) { msg.textContent = text; msg.className = 'msg' + (kind ? ' ' + kind : ''); }

  function show(user) {
    const inside = !!user;
    gate.hidden = inside; bar.hidden = !inside; caption.hidden = !inside;
    who.textContent = user ? user.email : '';
    if (!inside) password.value = '';
  }

  function setMode(m) {
    mode = m;
    tabLogin.setAttribute('aria-selected', m === 'login');
    tabSignup.setAttribute('aria-selected', m === 'signup');
    submit.textContent = m === 'login' ? 'Log in' : 'Create account';
    password.autocomplete = m === 'login' ? 'current-password' : 'new-password';
    say('');
  }
  tabLogin.addEventListener('click', () => setMode('login'));
  tabSignup.addEventListener('click', () => setMode('signup'));

  form.addEventListener('submit', async e => {
    e.preventDefault();
    if (!email.value || !email.checkValidity()) return say('Enter a valid email address.', 'error');
    if (password.value.length < 6) return say('Password must be at least 6 characters.', 'error');
    if (!sb) return say('The login service did not load. Refresh the page and try again.', 'error');
    submit.disabled = true; say(mode === 'login' ? 'Logging in…' : 'Creating account…');
    try {
      if (mode === 'login') {
        const { data, error } = await sb.auth.signInWithPassword({ email: email.value.trim(), password: password.value });
        if (error) throw error;
        say(''); show(data.user);
      } else {
        const { data, error } = await sb.auth.signUp({
          email: email.value.trim(), password: password.value,
          options: { emailRedirectTo: location.origin }
        });
        if (error) throw error;
        if (data.session) { say(''); show(data.user); }
        else { setMode('login'); say('Account created. Check your email and click the confirmation link, then log in.', 'ok'); }
      }
    } catch (err) {
      const text = err && err.message ? err.message : '';
      if (/fetch|network|load failed/i.test(text) && !onSite) say('Login works on edenstardust.com. This preview cannot reach the login server.', 'error');
      else if (/fetch|network|load failed/i.test(text)) say('Cannot reach the login server. Check your connection and try again.', 'error');
      else if (/invalid login/i.test(text)) say('Wrong email or password.', 'error');
      else if (/not confirmed/i.test(text)) say('Confirm your email first: click the link we sent you.', 'error');
      else say(text || 'Something went wrong. Try again.', 'error');
    } finally { submit.disabled = false; }
  });

  $('google').addEventListener('click', async () => {
    if (!onSite) return say('Google sign-in works on edenstardust.com.', 'error');
    if (!sb) return say('The login service did not load. Refresh the page and try again.', 'error');
    say('Opening Google…');
    const { error } = await sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.origin } });
    if (error) say(error.message, 'error');
  });

  $('signout').addEventListener('click', async () => {
    if (previewing) { previewing = false; return show(null); }
    try { if (sb) await sb.auth.signOut(); } catch (e) {}
    show(null);
  });

  if (!onSite) {
    const p = $('preview');
    p.hidden = false;
    p.addEventListener('click', () => { previewing = true; show({ email: 'Preview' }); });
  }

  show(null);
  if (sb) {
    sb.auth.getSession().then(({ data }) => { if (data.session) show(data.session.user); }).catch(() => {});
    sb.auth.onAuthStateChange((_event, session) => { if (!previewing) show(session ? session.user : null); });
  }
})();
</script>

</html>
