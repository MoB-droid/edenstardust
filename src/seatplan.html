<title>Seat Plan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: zoomable plan with numbered desks and team markers outside the shell, then one foldable seats table. */
:root {
  --bg: #f5f7f9; --paper: #ffffff; --fg: #18202a; --muted: #5d6874; --line: #d5dce3;
  --desk: #9fd0f5; --desk-edge: #3b88c4; --ink: #0b2c47; --accent: #1d5f9b; --pill: #18202a; --pill-ink: #ffffff;
  --clash: #d92d20; --clash-ink: #5c0d06; --team-hi: #f28c1c; --team-hi-ink: #2a1600; --plan: #ffffff; --img-filter: none; --img-op: .55;
  --display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11161b; --paper: #171d23; --fg: #e3e8ed; --muted: #97a2ae; --line: #2b343d;
    --desk: #6fb4e8; --desk-edge: #9fd0f5; --ink: #06243b; --accent: #7ab6ea; --pill: #e3e8ed; --pill-ink: #11161b;
    --plan: #0d1115; --img-filter: invert(1) hue-rotate(180deg); --img-op: .5; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11161b; --paper: #171d23; --fg: #e3e8ed; --muted: #97a2ae; --line: #2b343d;
  --desk: #6fb4e8; --desk-edge: #9fd0f5; --ink: #06243b; --accent: #7ab6ea; --pill: #e3e8ed; --pill-ink: #11161b;
  --plan: #0d1115; --img-filter: invert(1) hue-rotate(180deg); --img-op: .5; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--display); font-size: 15px; line-height: 1.45;
  padding-block: 24px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
main { max-width: 1280px; margin: 0 auto; display: grid; gap: 20px; }
main > * { min-width: 0; }
header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 12px 32px; border-bottom: 2px solid var(--fg); padding-bottom: 12px; }
h1 { font-weight: 600; font-size: 28px; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); margin: 4px 0 0; }
.sheet { display: grid; grid-template-columns: repeat(4, auto); gap: 2px 22px; margin: 0; font-family: var(--mono); }
.sheet dt { color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-size: 10px; }
.sheet dd { margin: 0; font-size: 16px; font-variant-numeric: tabular-nums; }
.bar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; }
.bar p { margin: 0; color: var(--muted); font-size: 13px; }
.zoom { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.zoom button { font: 500 13px var(--mono); background: var(--paper); color: var(--fg); border: 0; padding: 6px 12px; cursor: pointer; }
.zoom button + button { border-left: 1px solid var(--line); }
.zoom button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.planwrap.zoomed { cursor: grab; }
.dk.hasp { cursor: grab; }
#desks .dk rect { pointer-events: all; }
.planwrap.pmoving, .planwrap.pmoving * { cursor: grabbing !important; user-select: none; }
.dk.src rect { opacity: .45; }
.dk.drop rect { fill: var(--btn-off); fill-opacity: 1; stroke: var(--btn); stroke-width: 4; }
.pdrag { position: fixed; z-index: 60; pointer-events: none; background: #144878; color: #ffffff; font: 600 13px var(--display); padding: 5px 10px; border-radius: 6px; box-shadow: 0 4px 14px rgba(0,0,0,.2); white-space: nowrap; }
.planwrap.panning, .planwrap.panning * { cursor: grabbing !important; user-select: none; }
.planwrap { overflow: auto; border: 1px solid var(--line); background: var(--plan); border-radius: 4px; max-height: 82vh; display: flex; }
#plan { display: block; flex: none; width: 100%; height: auto; margin: auto; }
#plan .bgimg { filter: var(--img-filter); opacity: var(--img-op); }
.dk rect { fill: var(--desk); fill-opacity: .85; stroke: var(--desk-edge); stroke-width: 1.4; }
.dk text { fill: var(--ink); font: 600 15px var(--mono); text-anchor: middle; dominant-baseline: central; }
.dk { cursor: pointer; }
.dk text.pn { font: 600 15px var(--display); }
.dk.hi rect { fill: var(--accent); fill-opacity: 1; stroke: var(--fg); stroke-width: 3; }
.dk.hi text { fill: #ffffff; }
.team rect { fill: var(--pill); }
.team text { fill: var(--pill-ink); font: 600 42px var(--display); text-anchor: middle; dominant-baseline: central; letter-spacing: .02em; }
.team { cursor: pointer; }
.team:focus-visible { outline: none; }
.team:focus-visible rect { stroke: var(--accent); stroke-width: 5; }
.team[aria-pressed="true"] rect { fill: var(--team-hi); stroke: var(--fg); stroke-width: 3; }
.team[aria-pressed="true"] text { fill: var(--team-hi-ink); }
.lead.on { stroke: var(--team-hi); opacity: 1; stroke-width: 4; }
.dk.th rect, .dk.ts rect { fill: var(--team-hi); fill-opacity: 1; stroke: var(--team-hi-ink); stroke-width: 3; }
.dk.th text, .dk.ts text { fill: var(--team-hi-ink); }
.team text.tname { fill: var(--fg); font: 600 42px var(--display); letter-spacing: .02em; paint-order: stroke; stroke: var(--plan); stroke-width: 8px; stroke-linejoin: round; }
.team[aria-pressed="true"] text.tname { fill: var(--fg); }
.tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.team { touch-action: none; cursor: grab; }
.team.drag { cursor: grabbing; }
.dk.mv rect { fill: var(--desk); fill-opacity: 1; stroke: var(--clash); stroke-width: 2.5; stroke-dasharray: 6 4; }
/* a shaded team or person shows orange also on free desks it took (dashed) */
.dk.mv.th rect, .dk.mv.ts rect { fill: var(--team-hi); stroke: var(--team-hi-ink); stroke-width: 3; stroke-dasharray: none; }
.dk.empty rect { fill: none; stroke: var(--clash); stroke-width: 2.5; }
.dk.empty text { display: none; }
.dk.ov rect, .dk.ov.th rect, .dk.ov.ts rect { fill: var(--clash); fill-opacity: .92; stroke: var(--clash-ink); stroke-width: 2.5; }
.dk.ov text { fill: #ffffff; }
.team text.short { fill: var(--clash); font: 600 34px var(--display); letter-spacing: 0; paint-order: stroke; stroke: var(--plan); stroke-width: 8px; stroke-linejoin: round; }
.dk.unused { display: none; }
.seats tr.m.unused { display: none; }
/* totals: one line, font sized by fitTotals() so it spans the column width */
.tot { font-size: 18px; line-height: 1.2; white-space: nowrap; flex: 1 0 100%; min-width: 0; overflow: hidden; }
main > section.stack > * { min-width: 0; }
main > section.stack:last-child > .totrow:first-child { margin-top: 11px; }
/* the right column sits in a frame like the plan */
main > section.stack:last-child { border: 1px solid var(--line); border-radius: 4px; background: var(--paper); padding: 16px 18px; align-content: start; }
.seats thead th:first-child { padding-left: 24px; }
.tot .sep { color: var(--muted); font-weight: 400; margin: 0 0.45em; }
.seats td.del { text-align: right; width: 1%; position: relative; }
.acts { display: inline-flex; gap: 6px; align-items: center; }
.addbtn { font: 600 14px var(--mono); color: var(--muted); background: none; border: 1px solid var(--line); border-radius: 6px; padding: 1px 9px; cursor: pointer; }
.addbtn:hover { color: var(--accent); border-color: var(--accent); }
.seats tbody.on .addbtn { color: var(--team-hi-ink); border-color: var(--team-hi-ink); }
.delbtn { font: 500 13px var(--mono); color: var(--muted); background: none; border: 1px solid var(--line); border-radius: 6px; padding: 3px 10px; cursor: pointer; }
.delbtn:hover { color: var(--clash); border-color: var(--clash); }
.confirm { position: absolute; right: 100%; top: 50%; transform: translateY(-50%); margin-right: 8px; white-space: nowrap; z-index: 5;
  font: 600 14px var(--mono); color: #ffffff; background: var(--clash); border: 0; border-radius: 6px; padding: 6px 12px; cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,.22); }
.seats tbody.on .delbtn { color: var(--team-hi-ink); border-color: var(--team-hi-ink); }
tbody.grp.gone { display: none; }
.seats tr.m.pgone { display: none; }
.undo { min-width: 36px; font: 500 13px var(--mono); background: var(--fg); color: var(--bg); border: 0; border-radius: 6px; padding: 7px 14px; cursor: pointer; }
.undo:disabled { background: var(--line); color: var(--muted); cursor: default; }
.totrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; max-width: 640px; }
.tabletitle { margin-top: 14px; }
.tabletitle h2 { font-weight: 600; line-height: 1.2; letter-spacing: 0; }
.tip { position: relative; }
.tip::after { content: attr(data-tip); position: absolute; right: 0; bottom: calc(100% + 6px); white-space: nowrap; pointer-events: none;
  font: 500 12px var(--display); color: var(--bg); background: var(--fg); padding: 3px 8px; border-radius: 4px; opacity: 0; transition: opacity .12s; }
.tip:hover::after, .tip:focus-visible::after { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .tip::after { transition: none; } }
.delwrap { position: relative; display: inline-block; }
.ltitle { cursor: text; }
.emptyplan rect { fill: none; stroke: var(--line); stroke-width: 6; stroke-dasharray: 24 18; }
.emptyplan text { fill: var(--muted); font: 600 96px var(--display); text-anchor: middle; dominant-baseline: central; }
.emptyplan text.sub { font: 500 56px var(--display); }
.expmenu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 6; display: grid; min-width: 210px; background: var(--paper); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 6px 18px rgba(0,0,0,.16); overflow: hidden; }
.expmenu[hidden] { display: none; }
.expmenu button { font: 500 14px var(--display); text-align: left; background: none; border: 0; padding: 9px 12px; color: var(--fg); cursor: pointer; }
.expmenu button:hover, .expmenu button:focus-visible { background: color-mix(in srgb, var(--accent) 12%, transparent); outline: none; }
.ltitle input { font: 600 18px var(--display); padding: 2px 8px; border: 1px solid var(--accent); border-radius: 4px; background: var(--paper); color: var(--fg); min-width: 280px; }
#laymsg.ok { color: var(--fg); }
/* one message bar under the buttons: always there (so nothing jumps), empty until there is something to say */
.msgbar { min-height: 42px; box-sizing: border-box; margin: 10px 0 0; padding: 7px 14px; display: flex; flex-direction: column; justify-content: center; gap: 2px;
  background: var(--paper); border: 1px solid var(--line); border-left: 4px solid var(--line); border-radius: 8px; transition: border-color .15s, background-color .15s; }
.msgbar .saveerr { font: 600 15px var(--display); line-height: 1.35; }
.msgbar:has(.saveerr:not([hidden]):not(.ok)) { border-color: color-mix(in srgb, var(--clash) 45%, var(--line)); border-left-color: var(--clash); background: color-mix(in srgb, var(--clash) 6%, var(--paper)); }
.msgbar:has(#laymsg.ok:not([hidden])) { border-left-color: var(--accent); }
@media (prefers-reduced-motion: reduce) { .msgbar { transition: none; } }
.tabletitle .undo { padding: 3px 10px; border: 1px solid var(--fg); line-height: normal; }
/* row buttons line up under the title buttons: same widths, same gap, same right edge */
.tabletitle .tools { gap: 6px; padding-right: 0; }
.seats td.del, .seats th.del { padding-right: 8px !important; text-align: right; width: 1%; white-space: nowrap; }
.seats th.del .acts { justify-content: flex-end; }
.seats th.del #addteam { padding: 0; border: 1px solid var(--fg); height: 25px; }
.seats .addbtn, .seats .delbtn, #delprog { height: 25px; padding-top: 0; padding-bottom: 0; }
.tablewrap { overflow: visible !important; }
/* the PROGRAM table sits in its own frame */
.tablewrap { border: 1px solid var(--line); border-radius: 4px; }
.seats tbody:last-child tr:last-child td { border-bottom: 0; }
.seats .tn, .seats .nm { min-width: 0; white-space: normal; overflow-wrap: anywhere; }
@media (max-width: 560px) { .seats th, .seats td { padding-left: 5px; padding-right: 5px; } .seats thead th:first-child { padding-left: 21px; } #delprog, .seats .delbtn { width: 72px; } }
#addteam, .addbtn { width: 36px; min-width: 36px; padding-left: 0; padding-right: 0; text-align: center; }
#delprog, .seats .delbtn { width: 96px; padding-left: 0; padding-right: 0; text-align: center; }
.lead { stroke: var(--pill); stroke-width: 2.5; stroke-dasharray: 8 6; opacity: .55; pointer-events: none; }
h2 { font-weight: 600; font-size: 18px; margin: 0; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px 40px; align-items: start; }
.cols > * { min-width: 0; }
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-weight: 500; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
td.num, th.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
tfoot td { font-weight: 600; border-bottom: 0; }
.seats tr.m { cursor: pointer; }
.seats tbody tr.hi { background: color-mix(in srgb, var(--accent) 16%, transparent); }
.find { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.find input { font: 14px var(--display); padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); color: var(--fg); width: 200px; max-width: 60vw; }
main > section.stack { display: grid; gap: 10px; }
.seats { max-width: 640px; }
.ghrow { display: flex; align-items: center; gap: 12px; }
.tn { min-width: 180px; font-weight: 500; cursor: text; }
.tn input { font: 500 14px var(--display); width: 100%; padding: 4px 8px; margin: -5px 0; border: 1px solid var(--accent); border-radius: 4px; background: var(--paper); color: var(--fg); }
.fold { display: inline-flex; align-items: center; gap: 10px; flex: none; background: none; border: 0; padding: 2px 0; color: var(--fg); font: 600 15px var(--display); cursor: pointer; text-align: left; }
.fold .car { width: 0; height: 0; border-left: 6px solid var(--muted); border-top: 5px solid transparent; border-bottom: 5px solid transparent; transition: transform .15s; }
.fold[aria-expanded="true"] .car { transform: rotate(90deg); }
.seats tr.gh td.cnt { font-weight: 600; cursor: text; }
.cnt input { font: 600 14px var(--mono); width: 5em; padding: 4px 6px; margin: -5px 0; border: 1px solid var(--accent); border-radius: 4px; background: var(--paper); color: var(--fg); }
.seats tr.gh td { background: color-mix(in srgb, var(--fg) 4%, transparent); }
.hint { text-transform: none; letter-spacing: 0; font-weight: 400; }
.nm { min-width: 180px; cursor: text; }
.nm input { font: 14px var(--display); width: 100%; padding: 4px 8px; margin: -5px 0; border: 1px solid var(--accent); border-radius: 4px; background: var(--paper); color: var(--fg); }
.saveerr { color: var(--clash); font: 600 18px var(--display); margin: 0; }
.seats tr.m.sh td { background: var(--team-hi); color: var(--team-hi-ink); }
.seats tbody.on tr.gh td { background: var(--team-hi); }
.seats tbody.on .fold, .seats tbody.on .cnt, .seats tbody.on .tn { color: var(--team-hi-ink); }
.seats tbody.on .fold .car { border-left-color: var(--team-hi-ink); }
@media (prefers-reduced-motion: reduce) { .fold .car { transition: none; } }
.brand { justify-content: flex-start; gap: 14px; min-height: 48px; }
.brand .ltitle { font-weight: 600; line-height: 1.2; }
.ltitle input { font-size: inherit !important; }
.logo { width: 44px; height: 44px; flex: none; }
.ctrls { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 12px 10px; margin-top: 38px; }
.ctrl-left { display: grid; grid-template-columns: auto auto; gap: 8px; align-items: center; border: 1px solid var(--line); border-radius: 8px; padding: 8px; background: var(--paper); }
.ctrl-left .zoom { grid-column: 1 / -1; justify-self: stretch; display: flex; }
.ctrl-left .zoom button { flex: 1 1 0; }
.ctrl-left .undo { width: 100%; text-align: center; }
.ctrl-right { display: grid; grid-template-columns: auto auto auto; gap: 8px; margin-left: auto; align-content: start; align-items: center; }
.ctrl-right .span3 { grid-column: 1 / -1; }
.ctrl-right .span2 { grid-column: 2 / -1; }
/* where a download goes: one icon for the current place (this computer or Google Drive) */
.dest { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 27px; box-sizing: border-box; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); }
.dest svg { width: 18px; height: 18px; display: block; }
.dest .pc { fill: var(--fg); }
.sheetmenu .opt { display: flex; align-items: center; gap: 10px; }
.sheetmenu .opt svg { width: 18px; height: 18px; flex: none; }
.sheetmenu .opt .pc { fill: var(--fg); }
.sheetmenu .opt[aria-checked="true"] { font-weight: 600; }
.sheetmenu .opt[aria-checked="true"]::after { content: "✓"; margin-left: auto; padding-left: 12px; color: var(--accent); }
.ctrl-right .undo { width: 100%; text-align: center; }
.sheetwrap { position: relative; display: block; }
#sheet { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sheetmenu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 7; display: grid; min-width: 190px; background: var(--paper); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 6px 18px rgba(0,0,0,.16); overflow: hidden; }
.sheetmenu button { font: 500 14px var(--display); text-align: left; background: none; border: 0; padding: 9px 12px; color: var(--fg); cursor: pointer; }
.sheetmenu button:hover, .sheetmenu button:focus-visible { background: var(--btn-off); outline: none; }
.sheetmenu .sm-name { padding: 8px 12px 4px; font: 500 12px var(--display); color: var(--muted); overflow-wrap: anywhere; }
.btnrow { display: contents; }
#suggest, #undo { margin-top: 19px; }
.btnrow .undo { padding: 5px 12px; }
.undo.big { font-size: 16px; height: 44px; padding: 0 22px; border-radius: 8px; }
/* zoom group: same bar height and text size as Suggest / Undo */
.ctrls .zoom { border-radius: 8px; }
.ctrls .zoom button { font-size: 16px; height: 42px; padding: 0 18px; }
@media (min-width: 1200px) and (max-width: 1499px) { .ctrls .zoom button { padding: 0 10px; } .undo.big { padding: 0 13px; } .ctrl-right .undo { font-size: 12px; padding: 5px 8px; } }
.prognote { margin: 0; color: var(--muted); font-size: 14px; max-width: 640px; }
.tn[data-flag]::after { content: "  ⚠ " attr(data-flag); color: var(--clash); font: 500 12px var(--display); white-space: nowrap; }
.notes { margin: 0; padding-left: 20px; color: var(--muted); font-size: 13px; display: grid; gap: 4px; max-width: 75ch; }
/* buttons use the logo colours: blue #144878, light blue #9fd0f5, white */
:root { --btn: #144878; --btn-hover: #0e3659; --btn-ink: #ffffff; --btn-soft: #9fd0f5; --btn-off: #dbeaf7; --btn-off-ink: #6f8ba3; --btn-line-ink: #144878; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --btn-off: #1f3448; --btn-off-ink: #7f9bb3; --btn-line-ink: #9fd0f5; } }
:root[data-theme="dark"] { --btn-off: #1f3448; --btn-off-ink: #7f9bb3; --btn-line-ink: #9fd0f5; }
.undo { background: var(--btn) !important; color: var(--btn-ink) !important; border-color: var(--btn) !important; }
.undo:hover:not(:disabled) { background: var(--btn-hover) !important; border-color: var(--btn-hover) !important; }
.undo:disabled { background: var(--btn-off) !important; color: var(--btn-off-ink) !important; border-color: var(--btn-off) !important; }
.zoom { border-color: var(--btn-soft) !important; }
.zoom button { background: var(--paper); color: var(--btn-line-ink); }
.zoom button + button { border-left-color: var(--btn-soft) !important; }
.zoom button[aria-pressed="true"] { background: var(--btn) !important; color: var(--btn-ink) !important; }
.zoom button:hover:not([aria-pressed="true"]) { background: var(--btn-off); }
.delbtn, .addbtn { color: var(--btn-line-ink) !important; border-color: var(--btn-soft) !important; background: var(--paper) !important; }
.addbtn:hover { background: var(--btn-off) !important; }
.delbtn:hover { color: var(--clash) !important; border-color: var(--clash) !important; }
.ctrl-left { border-color: var(--btn-soft) !important; }
/* wide screens: layout on the left (stays in view while the program scrolls), totals and PROGRAM on the right */
@media (min-width: 1200px) {
  main { max-width: none; grid-template-columns: 65vw minmax(0, 1fr); align-items: start; column-gap: 28px; }
  .planwrap { height: calc(100vh - 114px); max-height: none; }
  body { padding-bottom: 24px; }
  main > section.stack:last-child .tn, main > section.stack:last-child .nm { min-width: 0; white-space: normal; overflow-wrap: anywhere; }
  main > section.stack:last-child th, main > section.stack:last-child td { padding-left: 6px; padding-right: 6px; }
  main > section.stack:last-child thead th:first-child { padding-left: 22px; }
  main > section.stack:last-child { overflow-y: auto; }
  main > section.stack:first-child { position: sticky; top: 16px; }
  main > section.stack:last-child .totrow, main > section.stack:last-child .seats, .prognote { max-width: none; }
}
@media (max-width: 560px) { h1 { font-size: 22px; } .sheet { grid-template-columns: repeat(2, auto); } }
/* drag and drop: the frame under the pointer lights up with what will happen */

    if ((onDrive('layout') || onDrive('program')) && onSite() && GSHEET.apiKey) googleReady().catch(function () {});   // ready for the next Download click
  }
  function saveDest(kind, d) {
    dest[kind] = d; paintDest();
    if (db) db.collection('meta').doc('dest').set(dest).then(function () {}, function () {});
  }
  // meta/dest from the database; plans that linked a folder before this existed send both downloads there
  window.__setDest = function (d, oldFolder) {
    if (d && (d.layout || d.program)) dest = { layout: d.layout || { to: 'pc' }, program: d.program || { to: 'pc' } };
    else if (oldFolder && oldFolder.id) dest = { layout: { to: 'drive', folder: oldFolder }, program: { to: 'drive', folder: oldFolder } };
    else dest = { layout: { to: 'pc' }, program: { to: 'pc' } };
    paintDest();
  };
  function pickFolder(kind) {
    if (!onSite()) { layNote('Saving to Google Drive works on edenstardust.com.'); return; }
    if (!GSHEET.apiKey) { layNote('Google Drive is not switched on yet.'); return; }
    googleReady().then(googleToken).then(function (token) {
      var gp = window.google.picker;
      var view = new gp.DocsView(gp.ViewId.FOLDERS).setIncludeFolders(true).setSelectFolderEnabled(true).setMimeTypes('application/vnd.google-apps.folder');
      new gp.PickerBuilder().addView(view).setOAuthToken(token).setDeveloperKey(GSHEET.apiKey).setAppId(GSHEET.appId)
        .setTitle('Choose the Google Drive folder for the ' + kind).setCallback(function (r) {
          if (r.action !== gp.Action.PICKED || !r.docs || !r.docs[0]) return;
          var f = r.docs[0];
          saveDest(kind, { to: 'drive', folder: { id: f.id, name: f.name, url: f.url || '' } });
          layNote('The ' + kind + ' will be saved to the Google Drive folder "' + f.name + '".', true);
        }).build().setVisible(true);
    }).catch(sheetError);
  }
  function lastFolder() { var a = destOf('layout').folder, b = destOf('program').folder; return a || b || null; }
  Object.keys(DEST_KINDS).forEach(function (kind) {
    var btn = document.getElementById('chg-' + kind); if (!btn) return;
    btn.addEventListener('click', function (e) {
      e.stopPropagation();
      var open = document.querySelector('.sheetmenu'); closeSheetMenu();
      if (open && open.dataset.kind === kind) return;
      var d = destOf(kind), drive = onDrive(kind), known = d.folder || lastFolder();
      var m = document.createElement('div'); m.className = 'sheetmenu'; m.dataset.kind = kind; m.setAttribute('role', 'menu');
      m.innerHTML = '<div class="sm-name">Save the ' + kind + ' to</div>'
        + '<button type="button" role="menuitemradio" class="opt" data-a="pc" aria-checked="' + !drive + '">' + ICON_PC + '<span>This computer</span></button>'
        + '<button type="button" role="menuitemradio" class="opt" data-a="drive" aria-checked="' + !!drive + '">' + ICON_DRIVE + '<span class="dn"></span></button>'
        + (known ? '<button type="button" data-a="other">Choose another folder…</button>' : '')
        + (drive ? '<button type="button" data-a="open">Open the folder</button>' : '');
      m.querySelector('.dn').textContent = known ? 'Google Drive · ' + known.name : 'Google Drive…';
      m.addEventListener('click', function (ev) {
        var t = ev.target.closest('button'); var a = t && t.dataset.a; if (!a) return;
        closeSheetMenu();
        if (a === 'pc') { saveDest(kind, { to: 'pc', folder: d.folder || null }); layNote('The ' + kind + ' will be downloaded to this computer.', true); }
        else if (a === 'drive') { if (known) { saveDest(kind, { to: 'drive', folder: known }); layNote('The ' + kind + ' will be saved to the Google Drive folder "' + known.name + '".', true); } else pickFolder(kind); }
        else if (a === 'other') pickFolder(kind);
        else window.open(d.folder.url || 'https://drive.google.com/drive/folders/' + d.folder.id, '_blank', 'noopener');
      });
      btn.parentNode.appendChild(m);
      m.querySelector('button').focus();
    });
  });
  document.addEventListener('click', function (e) { if (!e.target.closest('.sheetmenu, .chg')) closeSheetMenu(); });
  // at the Download click: get Google access now, so its window is not blocked
  window.__driveWarm = function (kind) {
    if (!onDrive(kind) || !onSite() || !GSHEET.apiKey) return;
    driveTok[kind] = googleReady().then(googleToken);
    driveTok[kind].catch(function () {});
  };
  // save into the chosen folder: the file with the same name is updated, else a new one is made
  window.__driveSave = function (name, blob, kind) {
    if (!onDrive(kind) || !onSite() || !GSHEET.apiKey) return false;
    var folder = destOf(kind).folder, tok = driveTok[kind] || googleReady().then(googleToken);
    driveTok[kind] = null;
    layNote('Saving ' + name + ' to Google Drive…', true);
    tok.then(function (token) {
      var q = "name = '" + name.replace(/\\/g, '\\\\').replace(/'/g, "\\'") + "' and '" + folder.id + "' in parents and trashed = false";
      return fetch('https://www.googleapis.com/drive/v3/files?fields=files(id)&q=' + encodeURIComponent(q), { headers: { Authorization: 'Bearer ' + token } })
        .then(function (r) { return r.ok ? r.json() : { files: [] }; })
        .then(function (found) {
          var id = found.files && found.files[0] && found.files[0].id;
          if (id) return fetch('https://www.googleapis.com/upload/drive/v3/files/' + id + '?uploadType=media&fields=id,webViewLink', { method: 'PATCH', headers: { Authorization: 'Bearer ' + token }, body: blob });
          var form = new FormData();
          form.append('metadata', new Blob([JSON.stringify({ name: name, parents: [folder.id] })], { type: 'application/json' }));
          form.append('file', blob);
          return fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,webViewLink', { method: 'POST', headers: { Authorization: 'Bearer ' + token }, body: form });
        })
        .then(function (r) { if (!r.ok) throw { code: 'http', status: r.status }; layNote('Saved to Google Drive: ' + folder.name + ' / ' + name, true); });
    }).catch(function (e) {
      layNote('Could not save to Google Drive' + (e && e.status ? ' (' + e.status + ')' : '') + '. The file is downloaded instead.');
      downloadFile(name, blob);
    });
    return true;
  };
  paintDest();
  paintSheet();
  // ---- Drag and drop: drop a floor plan (PDF / PNG / JPG) or a program (Excel / CSV) anywhere on the page.
  // The frame under the pointer lights up; the file type decides whether it is the layout or the program.
  var leftSec = document.querySelector('main > section.stack:first-child'), rightSec = document.querySelector('main > section.stack:last-child'), dropDepth = 0;
  leftSec.dataset.drop = 'Drop the floor plan here (PDF, PNG or JPG)';
  rightSec.dataset.drop = 'Drop the program here (Excel or CSV)';
  function dropKind(name) { return /[.](pdf|png|jpe?g)$/i.test(name) ? 'layout' : /[.](xlsx|xlsm|xls|csv|txt)$/i.test(name) ? 'program' : null; }
  function hasFiles(e) { return !!(e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types || [], 'Files') >= 0); }
  function dropMark(e) {
    var over = e.target && e.target.closest ? e.target.closest('main > section.stack') : null;
    leftSec.classList.toggle('dropping', over === leftSec);
    rightSec.classList.toggle('dropping', over === rightSec);
  }
  function clearDrop() { dropDepth = 0; leftSec.classList.remove('dropping'); rightSec.classList.remove('dropping'); }
  window.addEventListener('dragenter', function (e) { if (!hasFiles(e)) return; e.preventDefault(); dropDepth++; dropMark(e); });
  window.addEventListener('dragover', function (e) { if (!hasFiles(e)) return; e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; dropMark(e); });
  window.addEventListener('dragleave', function (e) { if (!hasFiles(e)) return; if (--dropDepth <= 0) clearDrop(); });
  window.addEventListener('drop', function (e) {
    if (!hasFiles(e)) return;
    e.preventDefault(); clearDrop();
    var f = e.dataTransfer.files && e.dataTransfer.files[0]; if (!f) return;
    var kind = dropKind(f.name);
    if (!kind) { layNote('Drop a floor plan (PDF, PNG or JPG) or a program (Excel or CSV).'); return; }
    var input = kind === 'layout' ? layfile : upfile;
    try { var dt = new DataTransfer(); dt.items.add(f); input.files = dt.files; }
    catch (err) { layNote('This browser cannot take dropped files. Use the Upload buttons.'); return; }
    input.dispatchEvent(new Event('change'));
  });
  function saveAdded(t, val) {
    pushStep([['added', t, clone(store.added[t])]]);
    if (val) store.added[t] = val; else delete store.added[t];
    syncAdded(); paint(); relayout();
    if (db) {
      var ref = db.collection('added').doc(t);
      (val ? ref.set({ order: val.order }) : ref.delete()).then(function () { showErr(''); }, function () {
        showErr('Not saved. You may not have edit access to this page.');
      });
    } else {
      try { localStorage.setItem(LS, JSON.stringify(store)); } catch (e) {}
    }
  }
  document.getElementById('addteam').addEventListener('click', function () {
    var t = 'a' + Date.now().toString(36);
    saveAdded(t, { order: Date.now() });
    var grp = document.querySelector('tbody.grp[data-t="' + t + '"]');
    if (grp) grp.scrollIntoView({ block: 'nearest' });
  });
  document.getElementById('undo').addEventListener('click', function () {
    var step = hist.pop(); if (!step) return;
    undoing = true;
    step.slice().reverse().forEach(function (it) {
      var k = it[0], id = it[1], prev = it[2];
      if (k === 'moves') { if (prev) store.moves[id] = prev; else delete store.moves[id]; saveMove(id); }
      else if (k === 'deleted') saveDeleted(id, !!prev);
      else if (k === 'gone') saveGone(id, !!prev);
      else if (k === 'added') saveAdded(id, prev);
      else if (k === 'pseat') writePseat(id, prev || null);
      else if (k === 'pkind') writePkind(id, !!prev);
      else if (k === 'ptype') writePtype(id, prev || null);
      else if (k === 'assign') writeAssign(id, prev || null);
      else if (k === 'title') window.__saveTitle(prev || '', false);
      else save(k, id, prev === undefined ? '' : String(prev));
    });
    undoing = false;
    paint(); relayout();
    keepHist();
  });
  keepHist();
  document.getElementById('srows').addEventListener('click', function (e) {
    var cf = e.target.closest('.confirm');
    if (cf) {
      e.stopPropagation(); closeConfirm();
      if (cf.dataset.s) {
        var row = document.querySelector('#srows tr.m[data-s="' + cf.dataset.s + '"]'), at = row && row.parentNode.dataset.t;
        if (at && (store.added[at] || row.hasAttribute('data-extra'))) {
          var nm = row.querySelector('.nm');
          var rest = Array.prototype.slice.call(row.parentNode.querySelectorAll(store.added[at] ? 'tr.m' : 'tr.m[data-extra]')), idx = rest.indexOf(row), step = [['need', at, clone(store.need[at])]];
          for (var q = idx; q < rest.length; q++) step.push(['names', rest[q].dataset.s, clone(store.names[rest[q].dataset.s])]);
          pushStep(step); undoing = true;
          for (var q2 = idx; q2 < rest.length - 1; q2++) save('names', rest[q2].dataset.s, store.names[rest[q2 + 1].dataset.s] || '');
          save('names', rest[rest.length - 1].dataset.s, '');
          var curNeed = +(document.querySelector('.cnt[data-k="need"][data-id="' + at + '"]').textContent || 0);
          save('need', at, String(Math.max(0, curNeed - 1)));
          undoing = false; relayout();
          return;
        }
        saveGone(cf.dataset.s, true); return;
      }
      var t = cf.dataset.t; shade(t, false); saveDeleted(t, true); return;
    }
    var ab = e.target.closest('.addbtn');
    if (ab) {
      e.stopPropagation(); closeConfirm();
      var at2 = ab.dataset.t, cur = +(document.querySelector('.cnt[data-k="need"][data-id="' + at2 + '"]').textContent || 0);
      save('need', at2, String(cur + 1));
      var g2 = ab.closest('tbody'); setOpen(g2, true);
      return;
    }
    var db1 = e.target.closest('.delbtn');
    if (db1) {
      e.stopPropagation();
      var open = db1.parentNode.querySelector('.confirm');
      closeConfirm();
      if (open) return;
      var c = document.createElement('button');
      c.type = 'button'; c.className = 'confirm'; c.textContent = 'Are you sure?';
      if (db1.dataset.s) { c.dataset.s = db1.dataset.s; c.setAttribute('aria-label', 'Yes, delete this person'); }
      else { c.dataset.t = db1.dataset.t; c.setAttribute('aria-label', 'Yes, delete team T' + db1.dataset.t); }
      db1.parentNode.appendChild(c); c.focus();
      return;
    }
    var b = e.target.closest('.fold');
    if (b) { var g = b.closest('tbody'); var open = b.getAttribute('aria-expanded') !== 'true'; setOpen(g, open); shade(g.dataset.t, open); return; }
    var r = e.target.closest('tr.m'); if (!r) return;
    shade(r.parentNode.dataset.t, false);
    var on = !r.classList.contains('sh');
    document.querySelectorAll('#srows tr.m.sh').forEach(function (o) { if (o !== r) o.classList.remove('sh'); });
    document.querySelectorAll('.dk.ts').forEach(function (d) { d.classList.remove('ts'); });
    r.classList.toggle('sh', on);
    // the person's desk = the one in the Seat column (program teams and moved teams sit at other desks than their row id)
    var seat = deskOfRow(r);
    if (on && seat) document.querySelectorAll('#desks .dk[data-s="' + seat + '"]').forEach(function (d) { d.classList.add('ts'); });
  });
}
START();
</script>
